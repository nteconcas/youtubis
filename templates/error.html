{% extends "base.html" %}

{% block title %}Erro {{ code }} - TubeDL{% endblock %}

{% block content %}
<section class="py-20 bg-gray-50 min-h-screen flex items-center">
    <div class="max-w-lg mx-auto px-4 text-center">
        <div class="w-24 h-24 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-exclamation-triangle text-red-500 text-4xl"></i>
        </div>
        <h1 class="text-6xl font-extrabold text-gray-900 mb-4">{{ code }}</h1>
        <h2 class="text-xl font-bold text-gray-700 mb-4">{{ message }}</h2>
        <p class="text-gray-500 mb-8">Algo deu errado. Tente novamente ou volte para a página inicial.</p>
        <a href="{{ url_for('index') }}" class="inline-flex items-center px-6 py-3 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl transition-colors shadow-lg">
            <i class="fas fa-home mr-2"></i>Voltar para o Início
        </a>
    </div>
</section>
{% endblock %}
